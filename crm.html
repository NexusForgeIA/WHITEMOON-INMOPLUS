<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>CRM Inmoplus · Panel interno</title>
<style>
  :root{
    --navy:#070b14;
    --navy-2:#0e1626;
    --panel:#131d30;
    --panel-2:#1a2740;
    --line:#233350;
    --azul:#5b8fd6;
    --azul-2:#3f6db3;
    --dorado:#c9a24b;
    --dorado-2:#e0bd68;
    --verde:#34d399;
    --rojo:#f87171;
    --text:#eef2f9;
    --muted:#8ea0bd;
    --muted-2:#5f7392;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--navy);color:var(--text);line-height:1.5;font-size:15px}
  button,input,select,textarea{font-family:inherit}
  a{color:inherit;text-decoration:none}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#2a3c5c;border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ===== LOGIN ===== */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1200px 600px at 70% -10%,rgba(91,143,214,.18),transparent 60%),var(--navy)}
  .login-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:38px 34px;width:100%;max-width:400px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
  .login-card .brand{font-size:1.6rem;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
  .login-card .brand span{color:var(--dorado)}
  .login-card .tag{color:var(--muted);font-size:.88rem;margin-bottom:26px}
  .fld{margin-bottom:16px}
  .fld label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
  .fld input,.fld select,.fld textarea{width:100%;background:var(--navy-2);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--text);font-size:.95rem;transition:border-color .2s}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--azul)}
  .fld.gerencia{display:none}
  .btn{background:var(--azul);color:#fff;border:none;border-radius:10px;padding:12px 20px;font-weight:600;cursor:pointer;font-size:.95rem;transition:filter .15s,transform .15s}
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .btn.gold{background:var(--dorado);color:var(--navy)}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
  .btn.ghost:hover{border-color:var(--azul)}
  .btn.sm{padding:7px 12px;font-size:.82rem;border-radius:8px}
  .btn.block{width:100%;justify-content:center}
  .login-err{color:var(--rojo);font-size:.85rem;margin-top:12px;min-height:18px}
  .login-hint{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted);line-height:1.7}
  .login-hint code{background:var(--navy-2);padding:2px 7px;border-radius:5px;color:var(--dorado-2)}

  /* ===== APP SHELL ===== */
  .app{display:none;min-height:100vh;flex-direction:column}
  .topbar{background:var(--navy-2);border-bottom:1px solid var(--line);padding:0 22px;display:flex;align-items:center;gap:18px;height:60px;position:sticky;top:0;z-index:50}
  .topbar .brand{font-weight:800;font-size:1.15rem;letter-spacing:-.3px}
  .topbar .brand span{color:var(--dorado)}
  .topbar .spacer{flex:1}
  .whoami{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:9px}
  .whoami .dot{width:9px;height:9px;border-radius:50%;background:var(--verde)}
  .whoami b{color:var(--text)}
  .role-badge{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:20px;background:rgba(91,143,214,.15);color:var(--azul);border:1px solid rgba(91,143,214,.3)}
  .role-badge.ger{background:rgba(201,162,75,.15);color:var(--dorado-2);border-color:rgba(201,162,75,.35)}

  .tabs{display:flex;gap:4px;padding:0 18px;background:var(--navy-2);border-bottom:1px solid var(--line);overflow-x:auto}
  .tab{background:none;border:none;color:var(--muted);padding:14px 16px;font-weight:600;font-size:.9rem;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;transition:color .15s}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text);border-bottom-color:var(--dorado)}

  .main{flex:1;padding:24px 22px 60px;max-width:1400px;width:100%;margin:0 auto}
  .panel-view{display:none}
  .panel-view.active{display:block;animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .view-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .view-head h1{font-size:1.35rem;font-weight:700;letter-spacing:-.3px}
  .view-head .spacer{flex:1}
  .muted{color:var(--muted)}
  .loading{color:var(--muted);padding:40px;text-align:center}
  .empty{color:var(--muted);padding:34px;text-align:center;border:1.5px dashed var(--line);border-radius:12px}

  /* ===== PIPELINE ===== */
  .group-head{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font-weight:700;font-size:1rem}
  .group-head:first-child{margin-top:0}
  .group-head .av{width:30px;height:30px;border-radius:50%;background:var(--panel-2);color:var(--azul);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;border:1px solid var(--line)}
  .group-head .count{color:var(--muted);font-weight:500;font-size:.85rem}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .col{background:var(--navy-2);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:80px}
  .col-head{display:flex;align-items:center;justify-content:space-between;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:12px;padding:0 2px}
  .col-head .n{background:var(--panel-2);color:var(--text);border-radius:20px;padding:1px 9px;font-size:.75rem}
  .col-empty{color:#4a5a78;font-size:.82rem;text-align:center;padding:16px 0}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:11px;border-left:3px solid var(--azul)}
  .card.op-vender{border-left-color:var(--dorado)}
  .card.op-comprar{border-left-color:var(--azul)}
  .card.op-alquilar{border-left-color:var(--verde)}
  .card .c-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .card .c-name{font-weight:700;font-size:.95rem}
  .op-pill{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:20px}
  .op-pill.vender{background:rgba(201,162,75,.16);color:var(--dorado-2)}
  .op-pill.comprar{background:rgba(91,143,214,.16);color:var(--azul)}
  .op-pill.alquilar{background:rgba(52,211,153,.16);color:var(--verde)}
  .card .c-tel{font-size:.88rem;color:var(--azul);font-weight:600;display:inline-flex;align-items:center;gap:5px}
  .card .c-meta{font-size:.82rem;color:var(--muted);margin:6px 0}
  .card .c-detalle{font-size:.85rem;color:#c3cee0;background:var(--navy-2);border-radius:8px;padding:7px 9px;margin:8px 0;max-height:64px;overflow:auto}
  .card .c-foot{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
  .card .c-date{font-size:.72rem;color:#60708c;margin-left:auto}
  .card select.estado-sel{background:var(--navy-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 7px;font-size:.78rem;font-weight:600;cursor:pointer}
  .icon-btn{background:var(--navy-2);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 9px;font-size:.8rem;cursor:pointer;transition:all .15s}
  .icon-btn:hover{border-color:var(--azul);color:var(--text)}
  .icon-btn.has{color:var(--dorado-2);border-color:rgba(201,162,75,.4)}
  .visit-tag{font-size:.74rem;color:var(--verde);background:rgba(52,211,153,.12);padding:2px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:4px}
  .resena-tag{font-size:.72rem;color:var(--dorado-2)}

  /* ===== TABLE ===== */
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--navy-2)}
  table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:720px}
  th{text-align:left;padding:12px 14px;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:rgba(91,143,214,.05)}
  .ref{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;color:var(--dorado-2)}
  .badge{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:capitalize;white-space:nowrap}
  .badge.disponible{background:rgba(52,211,153,.16);color:var(--verde)}
  .badge.reservado{background:rgba(201,162,75,.16);color:var(--dorado-2)}
  .badge.vendido{background:rgba(91,143,214,.16);color:var(--azul)}
  .badge.alquilado{background:rgba(148,163,184,.16);color:#b8c3d6}

  /* ===== KPIs ===== */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
  .kpi{background:var(--navy-2);border:1px solid var(--line);border-radius:14px;padding:18px}
  .kpi .k-val{font-size:2rem;font-weight:800;letter-spacing:-1px}
  .kpi .k-label{color:var(--muted);font-size:.82rem;margin-top:2px}
  .kpi.gold .k-val{color:var(--dorado-2)}
  .kpi.blue .k-val{color:var(--azul)}
  .kpi.green .k-val{color:var(--verde)}
  .cards-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px}
  .box{background:var(--navy-2);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .box h3{font-size:.95rem;margin-bottom:16px;font-weight:700}
  .bar-row{margin-bottom:12px}
  .bar-row .bl{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:5px}
  .bar-row .bl .v{color:var(--muted)}
  .bar-track{height:9px;background:var(--navy);border-radius:6px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;transition:width .5s ease}

  /* ===== MODAL ===== */
  .modal-bg{position:fixed;inset:0;background:rgba(3,6,12,.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px;z-index:200}
  .modal-bg.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:0 30px 70px rgba(0,0,0,.55)}
  .modal h2{font-size:1.15rem;margin-bottom:4px}
  .modal .m-sub{color:var(--muted);font-size:.85rem;margin-bottom:20px}
  .modal .m-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
  .chk-grid{display:flex;flex-wrap:wrap;gap:8px}
  .chk{display:inline-flex;align-items:center;gap:7px;background:var(--navy-2);border:1.5px solid var(--line);border-radius:9px;padding:8px 11px;cursor:pointer;font-size:.85rem;user-select:none}
  .chk input{width:auto;accent-color:var(--azul)}
  .chk.on{border-color:var(--azul);background:rgba(91,143,214,.1)}
  .cclen{font-size:.72rem;color:var(--muted);text-align:right;margin-top:4px}
  .modal-warn{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.35);color:#fca5a5;padding:10px 12px;border-radius:9px;font-size:.85rem;margin-top:12px;display:none}

  /* ===== TOAST ===== */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:12px 20px;border-radius:12px;font-size:.9rem;font-weight:600;box-shadow:0 14px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:all .3s;z-index:300}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:rgba(248,113,113,.5)}
  .toast.ok{border-color:rgba(52,211,153,.5)}

  @media(max-width:900px){
    .board{grid-template-columns:1fr 1fr}
    .cards-2{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .board{grid-template-columns:1fr}
    .main{padding:16px 14px 50px}
  }
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="brand">Inmo<span>plus</span> · CRM</div>
    <div class="tag">Panel interno del equipo comercial</div>
    <form id="loginForm">
      <div class="fld">
        <label>Usuario</label>
        <input type="text" id="liUser" autocomplete="username" placeholder="carlosv / gerente" required>
      </div>
      <div class="fld">
        <label>Contraseña</label>
        <input type="password" id="liPass" autocomplete="current-password" placeholder="••••" required>
      </div>
      <div class="fld gerencia" id="fldGerencia">
        <label>Clave de gerencia</label>
        <input type="password" id="liGer" placeholder="clave adicional de gerente">
      </div>
      <button type="submit" class="btn block" id="liBtn">Entrar</button>
      <div class="login-err" id="liErr"></div>
    </form>
    <div class="login-hint">
      <b style="color:var(--text)">Accesos demo</b><br>
      Comercial: <code>carlosv</code> / <code>demo</code><br>
      Gerente: <code>gerente</code> / <code>demo</code> + clave <code>admin2026</code>
    </div>
  </div>
</div>

<!-- ===== APP ===== -->
<div class="app" id="app">
  <div class="topbar">
    <div class="brand">Inmo<span>plus</span></div>
    <span class="muted" style="font-size:.8rem">CRM</span>
    <div class="spacer"></div>
    <div class="whoami"><span class="dot"></span> <b id="uaName"></b> <span class="role-badge" id="uaRole"></span></div>
    <button class="btn ghost sm" id="logoutBtn">Salir</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="main">
    <!-- MIS LEADS -->
    <section class="panel-view" data-view="leads">
      <div class="view-head">
        <h1 id="leadsTitle">Mis leads</h1>
        <div class="spacer"></div>
        <button class="btn ghost sm" onclick="loadLeads()">↻ Actualizar</button>
      </div>
      <div id="leadsBody" class="loading">Cargando…</div>
    </section>

    <!-- AGENDA -->
    <section class="panel-view" data-view="agenda">
      <div class="view-head">
        <h1>Agenda de visitas</h1>
        <span class="muted" style="font-size:.85rem">Hora de Madrid</span>
        <div class="spacer"></div>
        <button class="btn ghost sm" onclick="loadLeads()">↻ Actualizar</button>
      </div>
      <div id="agendaBody" class="loading">Cargando…</div>
    </section>

    <!-- CARTERA -->
    <section class="panel-view" data-view="cartera">
      <div class="view-head">
        <h1>Cartera de inmuebles</h1>
        <div class="spacer"></div>
        <button class="btn gold sm" id="newInmuebleBtn">+ Nuevo inmueble</button>
        <button class="btn ghost sm" onclick="loadInmuebles()">↻</button>
      </div>
      <div id="carteraBody" class="loading">Cargando…</div>
    </section>

    <!-- EQUIPO -->
    <section class="panel-view" data-view="equipo">
      <div class="view-head">
        <h1>Equipo comercial</h1>
        <div class="spacer"></div>
        <button class="btn ghost sm" onclick="loadEquipo()">↻ Actualizar</button>
      </div>
      <div id="equipoBody" class="loading">Cargando…</div>
    </section>

    <!-- RENDIMIENTO -->
    <section class="panel-view" data-view="rendimiento">
      <div class="view-head">
        <h1>Rendimiento</h1>
        <div class="spacer"></div>
        <button class="btn ghost sm" onclick="loadLeads()">↻ Actualizar</button>
      </div>
      <div id="rendimientoBody" class="loading">Cargando…</div>
    </section>
  </div>
</div>

<!-- ===== MODALES ===== -->
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<script>
const CRM_URL = 'https://mlaqtniujnvfxcvcourm.supabase.co/functions/v1/inmo-crm';
const ZONAS = ['Majadahonda','Las Rozas','Pozuelo','Boadilla','Madrid Centro','Otro Madrid'];
const TIPOS = ['Piso','Casa','Local','Otro'];
const ESTADOS = ['nuevo','asignado','contactado','visita','cerrado','descartado'];
const ESTADO_LABEL = {nuevo:'Nuevo',asignado:'Asignado',contactado:'Contactado',visita:'Visita',cerrado:'Cerrado',descartado:'Descartado'};
const INM_ESTADOS = ['disponible','reservado','vendido','alquilado'];
const COLS = [
  {key:'nuevos', title:'Nuevos', estados:['nuevo','asignado']},
  {key:'contactado', title:'Contactados', estados:['contactado']},
  {key:'visita', title:'Visita', estados:['visita']},
  {key:'cerrado', title:'Cerrados', estados:['cerrado','descartado']},
];

let session = null;      // {usuario, role}
let LEADS = [];          // cache de leads
let INMUEBLES = [];
let COMERCIALES = [];

/* ---------- API ---------- */
async function crm(payload){
  const r = await fetch(CRM_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  let j; try{ j = await r.json(); }catch{ j = {}; }
  if(!r.ok && !('ok' in j)) throw new Error(j.error || ('HTTP '+r.status));
  return j;
}

/* ---------- Helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){
  if(!iso) return '—';
  return new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'short',timeZone:'Europe/Madrid'}).format(new Date(iso));
}
function fmtMadrid(iso){
  if(!iso) return '—';
  return new Intl.DateTimeFormat('es-ES',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Madrid'}).format(new Date(iso));
}
function fmtEur(n){ return new Intl.NumberFormat('es-ES').format(Math.round(n||0)) + ' €'; }
function telHref(t){ return 'tel:'+String(t||'').replace(/\s/g,''); }
function toast(msg, kind){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + (kind||'');
  clearTimeout(t._t); t._t = setTimeout(()=>t.className='toast', 2600);
}

/* ---------- LOGIN ---------- */
const CREDS = {
  carlosv: {pass:'demo', role:'comercial', usuario:'carlosv', nombre:'Carlos V.'},
  gerente: {pass:'demo', role:'gerente', usuario:'gerente', nombre:'Gerencia', gerencia:'admin2026'},
};
document.getElementById('liUser').addEventListener('input', e=>{
  document.getElementById('fldGerencia').style.display = e.target.value.trim().toLowerCase()==='gerente' ? 'block' : 'none';
});
document.getElementById('loginForm').addEventListener('submit', e=>{
  e.preventDefault();
  const u = document.getElementById('liUser').value.trim().toLowerCase();
  const p = document.getElementById('liPass').value;
  const g = document.getElementById('liGer').value;
  const err = document.getElementById('liErr');
  const c = CREDS[u];
  if(!c || c.pass !== p){ err.textContent = 'Usuario o contraseña incorrectos.'; return; }
  if(c.gerencia && g !== c.gerencia){ err.textContent = 'Clave de gerencia incorrecta.'; return; }
  err.textContent = '';
  session = {usuario:c.usuario, role:c.role, nombre:c.nombre};
  try{ sessionStorage.setItem('inmo_crm_sess', JSON.stringify(session)); }catch{}
  enterApp();
});
document.getElementById('logoutBtn').addEventListener('click', ()=>{
  session = null;
  try{ sessionStorage.removeItem('inmo_crm_sess'); }catch{}
  document.getElementById('app').style.display='none';
  document.getElementById('loginWrap').style.display='flex';
  document.getElementById('loginForm').reset();
  document.getElementById('fldGerencia').style.display='none';
});

/* ---------- APP SHELL ---------- */
const TAB_DEFS = [
  {view:'leads', label:'Mis leads', roles:['comercial','gerente']},
  {view:'agenda', label:'Agenda', roles:['comercial','gerente']},
  {view:'cartera', label:'Cartera', roles:['comercial','gerente']},
  {view:'equipo', label:'Equipo', roles:['gerente']},
  {view:'rendimiento', label:'Rendimiento', roles:['gerente']},
];
let currentView = 'leads';

function enterApp(){
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('uaName').textContent = session.nombre;
  const rb = document.getElementById('uaRole');
  rb.textContent = session.role; rb.className = 'role-badge' + (session.role==='gerente'?' ger':'');
  document.getElementById('leadsTitle').textContent = session.role==='gerente' ? 'Todos los leads' : 'Mis leads';

  // Tabs según rol
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  TAB_DEFS.filter(t=>t.roles.includes(session.role)).forEach(t=>{
    const b = document.createElement('button');
    b.className = 'tab' + (t.view===currentView?' active':'');
    b.textContent = t.label;
    b.addEventListener('click', ()=>switchView(t.view));
    tabsEl.appendChild(b);
  });
  switchView('leads');
}

function switchView(view){
  currentView = view;
  document.querySelectorAll('.tab').forEach((b,i)=>{
    const def = TAB_DEFS.filter(t=>t.roles.includes(session.role))[i];
    b.classList.toggle('active', def && def.view===view);
  });
  document.querySelectorAll('.panel-view').forEach(v=>v.classList.toggle('active', v.dataset.view===view));
  if(view==='leads' || view==='agenda' || view==='rendimiento'){ if(!LEADS.length) loadLeads(); else renderCurrent(); }
  else if(view==='cartera') loadInmuebles();
  else if(view==='equipo') loadEquipo();
}
function renderCurrent(){
  if(currentView==='leads') renderLeads();
  else if(currentView==='agenda') renderAgenda();
  else if(currentView==='rendimiento') renderRendimiento();
}

/* ---------- LEADS ---------- */
async function loadLeads(){
  const targets = ['leadsBody','agendaBody','rendimientoBody'];
  try{
    const j = await crm({action:'list', usuario:session.usuario});
    LEADS = j.leads || [];
    renderCurrent();
  }catch(e){
    targets.forEach(id=>{const el=document.getElementById(id); if(el) el.innerHTML='<div class="empty">No se pudieron cargar los leads.<br>'+esc(e.message)+'</div>';});
    toast('Error cargando leads', 'err');
  }
}

function leadCard(l){
  const op = l.operacion;
  const hasNotas = l.notas && l.notas.trim();
  const estOpts = ESTADOS.map(s=>`<option value="${s}"${s===l.estado?' selected':''}>${ESTADO_LABEL[s]}</option>`).join('');
  return `<div class="card op-${esc(op)}">
    <div class="c-top">
      <span class="c-name">${esc(l.cliente_nombre)}</span>
      <span class="op-pill ${esc(op)}">${esc(op)}</span>
    </div>
    <a class="c-tel" href="${esc(telHref(l.cliente_telefono))}">📞 ${esc(l.cliente_telefono)}</a>
    <div class="c-meta">📍 ${esc(l.zona)}</div>
    ${l.detalle ? `<div class="c-detalle">${esc(l.detalle)}</div>` : ''}
    ${l.visita_at ? `<div style="margin:6px 0"><span class="visit-tag">🗓️ ${esc(fmtMadrid(l.visita_at))}${l.inmueble_ref?' · '+esc(l.inmueble_ref):''}</span></div>` : ''}
    ${l.estado==='cerrado' && l.resena_enviada ? `<div class="resena-tag">⭐ Reseña enviada</div>` : ''}
    <div class="c-foot">
      <select class="estado-sel" onchange="changeEstado('${l.id}', this.value, this)">${estOpts}</select>
      <button class="icon-btn" title="Agendar visita" onclick="openVisita('${l.id}')">🗓️</button>
      <button class="icon-btn ${hasNotas?'has':''}" title="Notas" onclick="openNotas('${l.id}')">📝</button>
      <span class="c-date">${esc(fmtDate(l.created_at))}</span>
    </div>
  </div>`;
}

function board(leads){
  return `<div class="board">` + COLS.map(col=>{
    const items = leads.filter(l=>col.estados.includes(l.estado));
    return `<div class="col">
      <div class="col-head"><span>${col.title}</span><span class="n">${items.length}</span></div>
      ${items.length ? items.map(leadCard).join('') : '<div class="col-empty">—</div>'}
    </div>`;
  }).join('') + `</div>`;
}

function renderLeads(){
  const el = document.getElementById('leadsBody');
  if(!LEADS.length){ el.innerHTML = '<div class="empty">Aún no hay leads. Prueba el chat CARLOS en la web 😉</div>'; return; }
  if(session.role !== 'gerente'){ el.innerHTML = board(LEADS); return; }
  // Gerente: agrupar por comercial
  const groups = {};
  LEADS.forEach(l=>{
    const key = l.comercial_asignado || 'Sin asignar';
    (groups[key] = groups[key] || []).push(l);
  });
  const names = Object.keys(groups).sort((a,b)=> a==='Sin asignar'?1 : b==='Sin asignar'?-1 : a.localeCompare(b));
  el.innerHTML = names.map(name=>{
    const initials = name==='Sin asignar' ? '—' : name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    return `<div class="group-head"><span class="av">${esc(initials)}</span> ${esc(name)} <span class="count">· ${groups[name].length} leads</span></div>${board(groups[name])}`;
  }).join('');
}

async function changeEstado(id, estado, selEl){
  const prev = LEADS.find(l=>l.id===id)?.estado;
  if(selEl) selEl.disabled = true;
  try{
    const j = await crm({action:'estado', lead_id:id, estado, usuario:session.usuario});
    if(!j.ok) throw new Error(j.error||'error');
    const l = LEADS.find(x=>x.id===id);
    if(l){ l.estado = estado; if(estado==='cerrado'){ l.resena_enviada = true; l.cerrado_at = new Date().toISOString(); } }
    toast(estado==='cerrado' ? 'Cerrado ✓ (reseña al comercial)' : 'Estado → '+ESTADO_LABEL[estado], 'ok');
    renderCurrent();
  }catch(e){
    toast('No se pudo cambiar el estado', 'err');
    if(selEl){ selEl.value = prev; selEl.disabled = false; }
  }
}

/* ---------- RENDIMIENTO ---------- */
function renderRendimiento(){
  const el = document.getElementById('rendimientoBody'); el.className='';
  if(!LEADS.length){ el.innerHTML='<div class="empty">Sin datos suficientes.</div>'; return; }
  const total = LEADS.length;
  const conVisita = LEADS.filter(l=>l.visita_at).length;
  const now = new Date();
  const cerradosMes = LEADS.filter(l=>l.estado==='cerrado' && l.cerrado_at && (()=>{const d=new Date(l.cerrado_at);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();})()).length;
  const ratio = total ? Math.round(conVisita/total*100) : 0;

  const porOp = {vender:0, comprar:0, alquilar:0};
  LEADS.forEach(l=>{ if(porOp[l.operacion]!==undefined) porOp[l.operacion]++; });
  const opColor = {vender:'var(--dorado)', comprar:'var(--azul)', alquilar:'var(--verde)'};

  const porZona = {};
  LEADS.forEach(l=>{ porZona[l.zona]=(porZona[l.zona]||0)+1; });
  const zonaEntries = Object.entries(porZona).sort((a,b)=>b[1]-a[1]);
  const maxZona = Math.max(1, ...zonaEntries.map(z=>z[1]));

  // por comercial
  const porCom = {};
  LEADS.forEach(l=>{
    const k = l.comercial_asignado || 'Sin asignar';
    const g = porCom[k] = porCom[k] || {asignados:0,visitas:0,cerrados:0};
    g.asignados++; if(l.visita_at) g.visitas++; if(l.estado==='cerrado') g.cerrados++;
  });

  const bar = (label,val,tot,color)=>{
    const pct = tot? Math.round(val/tot*100):0;
    return `<div class="bar-row"><div class="bl"><span style="text-transform:capitalize">${esc(label)}</span><span class="v">${val} · ${pct}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div></div>`;
  };

  el.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi blue"><div class="k-val">${total}</div><div class="k-label">Leads totales</div></div>
      <div class="kpi green"><div class="k-val">${ratio}%</div><div class="k-label">Ratio lead → visita</div></div>
      <div class="kpi gold"><div class="k-val">${cerradosMes}</div><div class="k-label">Cerrados este mes</div></div>
      <div class="kpi"><div class="k-val">${conVisita}</div><div class="k-label">Visitas agendadas</div></div>
    </div>
    <div class="cards-2">
      <div class="box"><h3>Leads por operación</h3>
        ${bar('Vender',porOp.vender,total,opColor.vender)}
        ${bar('Comprar',porOp.comprar,total,opColor.comprar)}
        ${bar('Alquilar',porOp.alquilar,total,opColor.alquilar)}
      </div>
      <div class="box"><h3>Leads por zona</h3>
        ${zonaEntries.map(([z,n])=>bar(z,n,maxZona,'var(--azul)')).join('') || '<span class="muted">—</span>'}
      </div>
    </div>
    <div class="box"><h3>Rendimiento por comercial</h3>
      <div class="table-wrap" style="border:none"><table style="min-width:auto">
        <thead><tr><th>Comercial</th><th>Asignados</th><th>Visitas</th><th>Cerrados</th><th>Conversión</th></tr></thead>
        <tbody>${Object.entries(porCom).map(([name,g])=>`<tr>
          <td><b>${esc(name)}</b></td><td>${g.asignados}</td><td>${g.visitas}</td><td>${g.cerrados}</td>
          <td>${g.asignados?Math.round(g.cerrados/g.asignados*100):0}%</td>
        </tr>`).join('')}</tbody></table></div>
    </div>`;
}

// --- Visita ---
function openVisita(id){
  const l = LEADS.find(x=>x.id===id); if(!l) return;
  let val = '';
  if(l.visita_at){
    // convertir UTC → valor datetime-local en hora de Madrid
    const parts = new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date(l.visita_at));
    const p = {}; parts.forEach(x=>p[x.type]=x.value);
    val = `${p.year}-${p.month}-${p.day}T${p.hour==='24'?'00':p.hour}:${p.minute}`;
  }
  openModal(`<h2>Agendar visita</h2><div class="m-sub">${esc(l.cliente_nombre)} · ${esc(l.zona)}</div>
    <div class="fld"><label>Fecha y hora (Madrid)</label><input type="datetime-local" id="vFecha" value="${val}"></div>
    <div class="fld"><label>Referencia de inmueble (opcional)</label><input type="text" id="vRef" placeholder="Ej. INM-014" value="${esc(l.inmueble_ref||'')}"></div>
    <div class="m-foot">
      ${l.visita_at?'<button class="btn ghost sm" onclick="saveVisita(\''+id+'\',true)">Quitar visita</button>':''}
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn gold" id="vSave" onclick="saveVisita('${id}',false)">Guardar</button>
    </div>`);
}
async function saveVisita(id, remove){
  const btn = document.getElementById('vSave');
  const ref = (document.getElementById('vRef').value||'').trim();
  let visita_at = null;
  if(!remove){
    const raw = document.getElementById('vFecha').value;
    if(!raw){ toast('Indica fecha y hora','err'); return; }
    visita_at = new Date(raw).toISOString(); // local (Madrid) → UTC ISO
  }
  if(btn){ btn.disabled=true; btn.textContent='Guardando…'; }
  try{
    const payload = {action:'visita', lead_id:id, visita_at, usuario:session.usuario, inmueble_ref: ref || null};
    const j = await crm(payload);
    if(!j.ok) throw new Error(j.error||'error');
    const l = LEADS.find(x=>x.id===id);
    if(l){ l.visita_at = visita_at; l.inmueble_ref = ref||null; if(visita_at && ['nuevo','asignado','contactado'].includes(l.estado)) l.estado='visita'; }
    closeModal(); toast(remove?'Visita eliminada':'Visita guardada','ok'); renderCurrent();
  }catch(e){ toast('No se pudo guardar la visita','err'); if(btn){btn.disabled=false;btn.textContent='Guardar';} }
}

function openInmueble(id){

  openModal(`<h2>${p?'Editar inmueble':'Nuevo inmueble'}</h2><div class="m-sub">${p?esc(p.referencia):'Referencia, título y zona obligatorios'}</div>
    ${p?'':`<div class="fld"><label>Referencia *</label><input type="text" id="iRef" placeholder="INM-000"></div>`}
    <div class="fld"><label>Título *</label><input type="text" id="iTitulo" value="${p?esc(p.titulo):''}" placeholder="Piso 3 hab. reformado"></div>
    <div class="fld"><label>Zona *</label><select id="iZona">${zonaOpts}</select></div>
    <div class="fld"><label>Tipo</label><select id="iTipo">${tipoOpts}</select></div>
    <div class="fld"><label>Operación</label><select id="iOp">${opOpts}</select></div>
    <div class="fld"><label>Precio (€)</label><input type="number" id="iPrecio" min="0" value="${p?(p.precio_eur||0):''}" placeholder="0"></div>
    ${p?`<div class="fld"><label>Estado</label><select id="iEstado">${estOpts}</select></div>`:''}
    <div class="modal-warn" id="iWarn"></div>
    <div class="m-foot"><button class="btn ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn gold" id="iSave" onclick="saveInmueble('${id||''}')">${p?'Guardar':'Crear'}</button></div>`);
}
async function saveInmueble(id){
  const btn = document.getElementById('iSave');
  const warn = document.getElementById('iWarn');
  warn.style.display='none';
  const campos = {
    titulo: (document.getElementById('iTitulo').value||'').trim(),
    zona: document.getElementById('iZona').value,
    tipo: document.getElementById('iTipo').value,
    operacion: document.getElementById('iOp').value,
    precio_eur: Number(document.getElementById('iPrecio').value)||0,
  };
  if(id) campos.estado = document.getElementById('iEstado').value;
  else campos.referencia = (document.getElementById('iRef').value||'').trim();
  if(!campos.titulo || !campos.zona || (!id && !campos.referencia)){
    warn.textContent = 'Referencia, título y zona son obligatorios.'; warn.style.display='block'; return;
  }
  if(btn){ btn.disabled=true; btn.textContent='Guardando…'; }
  try{
    const payload = {action:'inmueble-set', campos};
    if(id) payload.id = id;
    const j = await crm(payload);
    if(j.ok === false){ // referencia duplicada u otra razón de negocio
      warn.textContent = '⚠️ ' + (j.reason || 'No se pudo guardar.'); warn.style.display='block';
      if(btn){ btn.disabled=false; btn.textContent = id?'Guardar':'Crear'; }
      return;
    }
    if(!j.ok) throw new Error(j.error||'error');
    closeModal(); toast(id?'Inmueble actualizado':'Inmueble creado','ok'); loadInmuebles();
  }catch(e){ toast('Error al guardar el inmueble','err'); if(btn){ btn.disabled=false; btn.textContent=id?'Guardar':'Crear'; } }
}

function openComercial(id){
  const c = COMERCIALES.find(x=>x.id===id); if(!c) return;
  const zonaChks = ZONAS.map(z=>{
    const on = (c.zonas||[]).includes(z);
    return `<label class="chk ${on?'on':''}"><input type="checkbox" value="${esc(z)}" ${on?'checked':''} onchange="this.closest('.chk').classList.toggle('on',this.checked)">${esc(z)}</label>`;
  }).join('');
  const opChks = ['comprar','vender','alquilar'].map(o=>{
    const on = (c.operaciones||[]).includes(o);
    return `<label class="chk ${on?'on':''}"><input type="checkbox" value="${o}" ${on?'checked':''} onchange="this.closest('.chk').classList.toggle('on',this.checked)">${o}</label>`;
  }).join('');
  openModal(`<h2>Editar comercial</h2><div class="m-sub">${esc(c.usuario||'')} · ${esc(c.rol)}</div>
    <div class="fld"><label>Nombre</label><input type="text" id="cNombre" value="${esc(c.nombre)}"></div>
    <div class="fld"><label>WhatsApp</label><input type="text" id="cWa" value="${esc(c.wa_number||'')}" placeholder="34600000000"></div>
    <div class="fld"><label>CallMeBot API key</label><input type="password" id="cKey" placeholder="dejar vacío para no cambiar" autocomplete="new-password">
      <div class="cclen">${c.tiene_apikey?'Actualmente: Configurada ✓':'Actualmente: Sin configurar'}</div></div>
    <div class="fld"><label>Zonas</label><div class="chk-grid" id="cZonas">${zonaChks}</div></div>
    <div class="fld"><label>Operaciones</label><div class="chk-grid" id="cOps">${opChks}</div></div>
    <div class="fld"><label class="chk ${c.activo?'on':''}" style="width:fit-content"><input type="checkbox" id="cActivo" ${c.activo?'checked':''} onchange="this.closest('.chk').classList.toggle('on',this.checked)"> Activo</label></div>
    <div class="modal-warn" id="cWarn"></div>
    <div class="m-foot"><button class="btn ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn gold" id="cSave" onclick="saveComercial('${id}')">Guardar</button></div>`);
}
async function saveComercial(id){
  const btn = document.getElementById('cSave');
  const zonas = [...document.querySelectorAll('#cZonas input:checked')].map(i=>i.value);
  const operaciones = [...document.querySelectorAll('#cOps input:checked')].map(i=>i.value);
  const campos = {
    nombre: (document.getElementById('cNombre').value||'').trim(),
    wa_number: (document.getElementById('cWa').value||'').trim(),
    zonas, operaciones,
    activo: document.getElementById('cActivo').checked,
  };
  const key = document.getElementById('cKey').value;
  if(key.trim()) campos.callmebot_apikey = key.trim(); // vacío = conservar (backend lo respeta)
  if(btn){ btn.disabled=true; btn.textContent='Guardando…'; }
  try{
    const j = await crm({action:'comercial-update', id, campos});
    if(!j.ok) throw new Error(j.error||'error');
    closeModal(); toast('Comercial actualizado','ok'); loadEquipo();
  }catch(e){ toast('Error al actualizar','err'); if(btn){ btn.disabled=false; btn.textContent='Guardar'; } }
}

/* ---------- INIT ---------- */
(function init(){
  try{
    const s = sessionStorage.getItem('inmo_crm_sess');
    if(s){ session = JSON.parse(s); enterApp(); }
  }catch{}
})();
</script>
